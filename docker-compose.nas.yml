# Running bandai30 on the TrueNAS box.
#
# Differs from docker-compose.yml in one decisive way: it does NOT build. The
# image comes from GHCR, built by .github/workflows/image.yml on GitHub's
# runners. Nothing in this repo executes on the NAS — it pulls a finished
# image, which is the whole reason this arrangement is safer than putting a
# self-hosted runner on the machine that holds your storage.
#
# Usage on the NAS (TrueNAS SCALE ≥ 24.10 has Docker natively; in the UI this
# goes in Apps → Discover → Custom App → "Install via YAML"):
#
#   BANDAI30_DATA_DIR=/mnt/<pool>/<dataset>/bandai30 \
#   BANDAI30_LAN_HOST=<nas LAN address> \
#     docker compose -f docker-compose.nas.yml up -d
#
#   docker compose -f docker-compose.nas.yml pull && \
#   docker compose -f docker-compose.nas.yml up -d      # take a new build
#
# An empty data directory is fine: the app creates the database, seeds the
# collections and scrapes its own catalogue on first run (README, "First run").
#
# ⚠️ BANDAI30_DATA_DIR MUST be a local ZFS dataset. Never an NFS/SMB share and
# never a path on another machine: SQLite coordinates writers with POSIX locks,
# which network filesystems do not implement faithfully.
#
# That warning is also the POINT of this file. On the Mac this data lived on a
# Docker Desktop bind mount — a VirtioFS forwarding layer — and the database
# was silently corrupted twice (2026-07-31, 2026-08-06), losing whole pages
# with the header among them. A local dataset on native Linux Docker removes
# that layer entirely.
services:
  app:
    image: ghcr.io/jibril2333/bandai30:latest
    container_name: bandai30
    restart: unless-stopped
    # Must match the owner of BANDAI30_DATA_DIR, or every write — status
    # changes, scheduled scrapes, backups — fails at write time. TrueNAS apps
    # run as 568:568 (`apps`); confirm with `ls -n` on the dataset.
    user: "${BANDAI30_UID:-568}:${BANDAI30_GID:-568}"
    ports:
      - "${BANDAI30_PORT:-3010}:3010"
    environment:
      BANDAI30_ADDR: "0.0.0.0:3010"
      BANDAI30_DATA: "/data"
      # Auth is enforced at the network layer (Cloudflare Access in front of
      # the tunnel), not by the app.
      BANDAI30_NO_AUTH: "1"
      # Defaults only, for a fresh database. The real cadences are stored in
      # the DB by the settings page and survive this container being recreated
      # — which watchtower does on every new build.
      BANDAI30_SCRAPE_INTERVAL: "168h"
      BANDAI30_FULL_INTERVAL: "720h"
      # These used to arrive from GitHub secrets, injected by the Mac's deploy
      # workflow at `docker compose up` time. That path is gone: CI no longer
      # touches this machine, so runtime configuration lives HERE, in the app's
      # YAML in the TrueNAS UI. Empty server means ntfy.sh.
      BANDAI30_NTFY_SERVER: "${BANDAI30_NTFY_SERVER:-}"
      BANDAI30_NTFY_TOPIC: "${BANDAI30_NTFY_TOPIC:-}"
      BANDAI30_NTFY_TOKEN: "${BANDAI30_NTFY_TOKEN:-}"
      TZ: "${BANDAI30_TZ:-Asia/Tokyo}"
    healthcheck:
      # /api/health reads from SQLite before answering, so this reports
      # unhealthy on a corrupt or unreadable database rather than merely
      # proving the process still holds the port. wget is busybox's, already
      # in the alpine base.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "-T", "5", "http://127.0.0.1:3010/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - ${BANDAI30_DATA_DIR:?set BANDAI30_DATA_DIR to the dataset holding bandai30.db + photos}:/data
    labels:
      # Watchtower only touches containers carrying this label (it runs with
      # --label-enable below), so nothing else on the box can be restarted by
      # a registry poll.
      com.centurylinklabs.watchtower.enable: "true"
      homepage.group: "本地服务"
      homepage.name: "Bandai 收藏"
      homepage.icon: "mdi-robot-industrial"
      # The LAN address, not localhost: homepage runs on the NAS and the link
      # is followed by a browser on some other machine. Set BANDAI30_LAN_HOST
      # to your own NAS — the default is only a placeholder.
      homepage.href: "http://${BANDAI30_LAN_HOST:-nas.local}:${BANDAI30_PORT:-3010}"
      homepage.description: "万代 30MS/30MM 模型收藏管理"
      homepage.showStats: "true"

  # Takes a new build without anything reaching into the NAS from outside.
  #
  # The alternative — a GitHub Actions self-hosted runner on the NAS — was
  # rejected on purpose: this repo is public, and a runner executes whatever a
  # workflow says on the machine that holds your storage. Here the traffic is
  # outbound only: watchtower asks GHCR whether the digest moved, and if it
  # did, pulls and recreates the one container carrying the label above.
  #
  # It needs the Docker socket, which is a real privilege — but it is NAS
  # admin tooling, not the internet-facing app. The app itself still has no
  # socket, which is the property that matters.
  #
  # Behind a profile, because watchtower is host-level tooling and one per box
  # is enough. On a machine that already runs one for another app, leave this
  # off and the label above is all this container needs:
  #
  #   docker compose -f docker-compose.nas.yml up -d                    # app only
  #   docker compose -f docker-compose.nas.yml --profile auto-update up -d
  #
  # The profile decides what RUNS, not what is parsed: compose interpolates
  # every service in the file whatever profile is active, so the `:?` below
  # fires even on the app-only line. Set BANDAI30_WATCHTOWER_TOKEN to any
  # placeholder when running without the profile. Keeping `:?` is still worth
  # that: an empty token on a published --http-api-update endpoint would be an
  # unauthenticated "restart my containers" button.
  watchtower:
    image: containrrr/watchtower
    container_name: bandai30-watchtower
    restart: unless-stopped
    profiles: ["auto-update"]
    # Two ways in, and they cover each other:
    #   · --interval: the poll. Still there so a deploy isn't lost when the
    #     NAS was down at the moment CI called.
    #   · --http-api-update: an endpoint that updates NOW. GitHub Actions calls
    #     it at the end of a build, over Tailscale — see .github/workflows.
    #
    # The endpoint is NOT published to the internet: no port forward, nothing
    # on the Cloudflare tunnel. It is reachable from the LAN and the tailnet,
    # and the token is what authorises the call. Note what CI can and cannot
    # do with it: ask watchtower to pull labelled images. Not a shell, not
    # SSH, not the Docker socket — that stays inside this container.
    command: >-
      --label-enable --cleanup
      --interval ${BANDAI30_WATCH_INTERVAL:-3600}
      --http-api-update --http-api-periodic-polls
    environment:
      WATCHTOWER_HTTP_API_TOKEN: "${BANDAI30_WATCHTOWER_TOKEN:?set a long random token; GitHub Actions sends it}"
    ports:
      - "${BANDAI30_WATCHTOWER_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
