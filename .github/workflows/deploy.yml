name: Deploy to Docker

# SECURITY: this job runs on a SELF-HOSTED runner (the owner's own Mac, the
# same machine that serves the app). It must NEVER trigger on pull_request /
# pull_request_target — those events run untrusted contributor code and would
# hand arbitrary code execution to this machine. `push` to `main` is safe
# because only the repo owner has push access. Do not broaden the trigger, and
# do not make this repo public with an unchanged trigger set, without
# re-checking collaborator and branch-protection state first.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  # Serialize deploys: two jobs recreating the same container at once would
  # fight over the container name and the bind-mounted SQLite file.
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    # The `bandai30` label pins this to the runner registered for this repo on
    # this Mac (the other runners here serve card-deck-builder / uptcg-app).
    runs-on: [self-hosted, bandai30]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Put Docker Desktop's bin on PATH
        # The host's ~/.docker/config.json sets `credsStore: "desktop"`, so
        # BuildKit shells out to `docker-credential-desktop` even for ANONYMOUS
        # pulls of public images. That binary (and the docker CLI itself) lives
        # in Docker.app and is NOT on the self-hosted runner's minimal PATH, so
        # the build would die at "load metadata for golang:1.26-alpine". Add
        # that dir to PATH so the helper resolves. (We deliberately do NOT
        # override DOCKER_CONFIG — the `docker compose` CLI plugin is
        # discovered via the default ~/.docker/cli-plugins, and pointing
        # DOCKER_CONFIG elsewhere loses it → "unknown command: docker compose".)
        run: echo "/Applications/Docker.app/Contents/Resources/bin" >> "$GITHUB_PATH"

      - name: Build image
        run: docker compose build

      - name: Deploy (recreate container with the new image)
        # The runner checks the repo out to its own _work dir, which has NO
        # data/ (gitignored). The container must bind-mount the real DB +
        # photos from the owner's project dir, by absolute path.
        #
        # BANDAI30_DATA_DIR is set here in `env:` (not inline `VAR=x cmd`) so
        # it is exported into the whole step's shell for `docker compose` to
        # interpolate — an inline assignment failed to propagate once and the
        # container silently fell back to the compose default `./data`, which
        # resolves to the EMPTY _work checkout; the app then created a blank DB
        # there and served an empty catalog while the real data sat untouched.
        # The guard below makes that failure mode impossible: if the resolved
        # data dir has no real bandai30.db, the deploy aborts instead of
        # booting on an empty database.
        env:
          BANDAI30_NTFY_TOPIC: ${{ secrets.BANDAI30_NTFY_TOPIC }}
          BANDAI30_NTFY_TOKEN: ${{ secrets.BANDAI30_NTFY_TOKEN }}
          BANDAI30_DATA_DIR: /Users/rei/bandai30/data
        run: |
          if [ ! -s "$BANDAI30_DATA_DIR/bandai30.db" ]; then
            echo "::error::real DB not found at $BANDAI30_DATA_DIR/bandai30.db — refusing to deploy onto an empty data dir" >&2
            exit 1
          fi
          docker compose up -d --remove-orphans

      - name: Wait for container to report healthy
        # Gate on Docker's own health status rather than a curl from the host:
        # it exercises the compose healthcheck (so a broken probe fails the
        # deploy instead of silently marking the container unhealthy forever)
        # and it proves the app answers from INSIDE the container, not just
        # that the published port is reachable.
        run: |
          for i in $(seq 1 45); do
            status=$(docker inspect -f '{{.State.Health.Status}}' bandai30 2>/dev/null || echo missing)
            case "$status" in
              healthy)   echo "healthy"; exit 0 ;;
              unhealthy) echo "container reported unhealthy" >&2; break ;;
            esac
            sleep 2
          done
          echo "app did not become healthy in time (last status: ${status:-unknown})" >&2
          docker compose logs --tail=100
          exit 1

      - name: Verify the published port serves the catalog
        # The health probe runs inside the container; this confirms the 3010
        # port publish that cloudflared depends on is actually wired up.
        run: curl -fsS http://localhost:3010/api/collections > /dev/null

      - name: Prune dangling images
        if: always()
        run: docker image prune -f
