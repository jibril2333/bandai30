name: Deploy to Docker

# SECURITY: this job runs on a SELF-HOSTED runner (the owner's own Mac, the
# same machine that serves the app). It must NEVER trigger on pull_request /
# pull_request_target — those events run untrusted contributor code and would
# hand arbitrary code execution to this machine. `push` to `main` is safe
# because only the repo owner has push access. Do not broaden the trigger, and
# do not make this repo public with an unchanged trigger set, without
# re-checking collaborator and branch-protection state first.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  # Serialize deploys: two jobs recreating the same container at once would
  # fight over the container name and the bind-mounted SQLite file.
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    # The `bandai30` label pins this to the runner registered for this repo on
    # this Mac (the other runners here serve card-deck-builder / uptcg-app).
    runs-on: [self-hosted, bandai30]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Put Docker Desktop's bin on PATH
        # The host's ~/.docker/config.json sets `credsStore: "desktop"`, so
        # BuildKit shells out to `docker-credential-desktop` even for ANONYMOUS
        # pulls of public images. That binary (and the docker CLI itself) lives
        # in Docker.app and is NOT on the self-hosted runner's minimal PATH, so
        # the build would die at "load metadata for golang:1.26-alpine". Add
        # that dir to PATH so the helper resolves. (We deliberately do NOT
        # override DOCKER_CONFIG — the `docker compose` CLI plugin is
        # discovered via the default ~/.docker/cli-plugins, and pointing
        # DOCKER_CONFIG elsewhere loses it → "unknown command: docker compose".)
        run: echo "/Applications/Docker.app/Contents/Resources/bin" >> "$GITHUB_PATH"

      - name: Build image
        run: docker compose build

      - name: Deploy (recreate container with the new image)
        # The runner checks the repo out to its own _work dir, which has no
        # data/ (gitignored). Mount the real DB + photos from the project dir
        # by absolute path so the container sees the owner's actual catalog.
        env:
          BANDAI30_NTFY_TOPIC: ${{ secrets.BANDAI30_NTFY_TOPIC }}
        run: |
          BANDAI30_DATA_DIR="$HOME/bandai30/data" \
            docker compose up -d --remove-orphans

      - name: Wait for health check
        # /api/collections round-trips through SQLite, so a 200 here proves the
        # bind mount resolved and the DB is readable — not just that the
        # process bound the port.
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:3010/api/collections > /dev/null; then
              echo "up"; exit 0
            fi
            sleep 2
          done
          echo "app did not become healthy in time" >&2
          docker compose logs --tail=100
          exit 1

      - name: Prune dangling images
        if: always()
        run: docker image prune -f
