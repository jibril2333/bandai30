# Bandai30 in Docker, for LOCAL development on a workstation.
#
# This is no longer how production runs. Production is the TrueNAS box: `git
# push` builds an image on GitHub's runners, publishes it to GHCR, and
# watchtower on the NAS pulls it — see docker-compose.nas.yml and
# .github/workflows/image.yml. The self-hosted runner that used to build and
# recreate this container on the Mac has been removed.
#
# It moved because of this file's `volumes:` line. On macOS a bind mount is a
# VirtioFS forwarding layer, and the SQLite database on the other side of it
# was silently corrupted twice — 2026-07-31 and 2026-08-06 — losing whole
# pages with the file header among them. Use this compose file for
# development; don't put data you care about behind it.

services:
  app:
    build: .
    image: bandai30:prod
    container_name: bandai30
    restart: unless-stopped
    # Run as the host owner (uid 501 / gid 20 = staff on this Mac) so the
    # bind-mounted SQLite DB — owned by that user — is writable. A container
    # user that could only READ it would make every status change and every
    # scheduled scrape fail at write time.
    user: "501:20"
    ports:
      - "3010:3010"
    environment:
      BANDAI30_ADDR: "0.0.0.0:3010"
      BANDAI30_DATA: "/data"
      # Auth is enforced at the network layer (Cloudflare Access in front of
      # the tunnel), not by the app. Equivalent to passing -no-auth.
      BANDAI30_NO_AUTH: "1"
      # Weekly refresh + ntfy push. Measured from the last run recorded in the
      # DB, not from container start, so redeploys don't keep resetting the
      # countdown. The ntfy topic is injected by the workflow from a repo
      # secret so it never lands in git.
      # Two cadences: the cheap listing pass weekly, the detail-page pass
      # monthly. Both are only DEFAULTS — the settings page stores the real
      # values in the database, which survives this container being recreated.
      BANDAI30_SCRAPE_INTERVAL: "168h"
      BANDAI30_FULL_INTERVAL: "720h"
      TZ: Asia/Tokyo
    volumes:
      # The real SQLite DB + ~600 scraped photos, persisted across rebuilds.
      # NEVER bake this into the image — data/ is gitignored personal data.
      #
      # BANDAI30_DATA_DIR MUST be an absolute host path in CI: the Actions
      # runner runs `docker compose` from its own _work checkout, which has no
      # data/ dir, so a relative `./data` would mount an empty directory and
      # the app would come up with an empty catalog. The workflow sets it to
      # $HOME/bandai30/data. For local runs from the project root the default
      # `./data` resolves correctly.
      - ${BANDAI30_DATA_DIR:-./data}:/data
    # /api/collections round-trips through SQLite, so a pass here proves the
    # bind mount resolved and the DB is readable — not merely that the process
    # is holding the port. wget is busybox's, already in the alpine base.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "-T", "5", "http://127.0.0.1:3010/api/collections"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Startup is ~1s, but the first scrape tick can briefly hold the DB.
      start_period: 20s
    labels:
      homepage.group: "本地服务"
      homepage.name: "Bandai 收藏"
      homepage.icon: "mdi-robot-industrial"
      homepage.href: "http://localhost:3010"
      homepage.description: "万代 30MS/30MM 模型收藏管理"
      homepage.showStats: "true"
